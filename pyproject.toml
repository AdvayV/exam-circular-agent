[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-circular-agent"
version = "0.1.0"
description = "Review exam schedule changes against a local calendar."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "icalendar>=6.3,<8",
    "openai>=2.44,<3",
    "pydantic>=2.12,<3",
    "pillow>=11,<14",
    "pypdfium2>=5,<6",
]

[project.scripts]
exam-circular-agent = "exam_circular_agent.cli:main"

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
