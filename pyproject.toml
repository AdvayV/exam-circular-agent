[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-circular-agent"
version = "0.1.0"
description = "Review exam schedule changes against a local calendar."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "icalendar>=6.3,<8",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
